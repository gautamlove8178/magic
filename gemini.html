<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For Marya ✨</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Poppins:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.ripples/0.6.3/jquery.ripples.min.js"></script>

  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --gold: #d4af7a;
      --gold-light: #f0d9a8;
      --white: #ffffff;
      --dim: rgba(255,255,255,0.55);
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow-x: hidden;
      scroll-behavior: smooth;
      background: #000;
      font-family: 'Poppins', sans-serif;
      cursor: none;
      -webkit-overflow-scrolling: touch;
    }

    body.lock-scroll { overflow: hidden; }

    /* ── Custom Cursor ── */
    .cursor {
      position: fixed;
      width: 12px;
      height: 12px;
      background: var(--white);
      border-radius: 50%;
      pointer-events: none;
      z-index: 999999;
      transform: translate(-50%, -50%);
      transition: transform 0.1s ease, opacity 0.3s ease;
      mix-blend-mode: difference;
    }

    .cursor-ring {
      position: fixed;
      width: 38px;
      height: 38px;
      border: 1px solid rgba(255,255,255,0.5);
      border-radius: 50%;
      pointer-events: none;
      z-index: 999998;
      transform: translate(-50%, -50%);
      transition: all 0.15s ease;
      mix-blend-mode: difference;
    }

    /* ── Audio Toggle ── */
    .audio-toggle {
      position: fixed;
      top: 30px;
      right: 40px;
      z-index: 100000;
      width: 45px;
      height: 45px;
      border-radius: 50%;
      border: 1px solid rgba(212,175,122,0.4);
      background: rgba(0,0,0,0.3);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: none;
      opacity: 0;
      transform: translateY(-20px);
      transition: all 0.4s ease;
      color: var(--gold-light);
    }
    
    .audio-toggle.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .audio-toggle:hover {
      border-color: var(--gold);
      box-shadow: 0 0 15px rgba(212,175,122,0.3);
    }

    /* ── Entry Screen ── */
    .intro {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 18px;
      overflow: hidden;
    }

    .intro-label {
      font-family: 'Cinzel', serif;
      font-size: clamp(0.7rem, 3.5vw, 0.8rem);
      letter-spacing: 6px;
      color: var(--gold);
      text-transform: uppercase;
      opacity: 0.7;
      animation: fadeUpIn 2s ease forwards;
    }

    @keyframes fadeUpIn {
      from { opacity: 0; transform: translateY(12px); filter: blur(5px); }
      to   { opacity: 0.7; transform: translateY(0); filter: blur(0); }
    }

    .intro::before {
      content: '';
      position: absolute;
      width: 520px;
      height: 520px;
      background: radial-gradient(circle, rgba(212,175,122,0.1), transparent 68%);
      filter: blur(50px);
      animation: glowPulse 5s infinite ease-in-out;
    }

    @keyframes glowPulse {
      0%,100% { transform: scale(1);   opacity: 0.5; }
      50%     { transform: scale(1.2); opacity: 1;   }
    }

    .start-btn {
      position: relative;
      z-index: 10;
      padding: 20px 52px;
      border: none;
      outline: none;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(10px);
      color: var(--white);
      font-family: 'Poppins', sans-serif;
      font-size: 1rem;
      font-weight: 300;
      letter-spacing: 4px;
      text-transform: uppercase;
      border-radius: 60px;
      cursor: none;
      overflow: hidden;
      border: 1px solid rgba(212,175,122,0.4);
      transition: all 0.4s ease;
      box-shadow: 0 0 30px rgba(212,175,122,0.15), 0 0 60px rgba(212,175,122,0.08);
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .start-btn:hover {
      border-color: rgba(212,175,122,0.9);
      background: rgba(212,175,122,0.1);
      box-shadow: 0 0 50px rgba(212,175,122,0.3), 0 0 100px rgba(212,175,122,0.2);
      transform: scale(1.02);
    }

    /* ── Backgrounds ── */
    .bg-container {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: #000;
    }

    .bg {
      position: absolute;
      inset: -5%;
      background-size: cover;
      background-position: center;
      opacity: 0;
      transform: scale(1.1);
      will-change: opacity, transform;
      transition: opacity 2s ease-in-out, transform 2s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .bg.active { 
      opacity: 1; 
      transform: scale(1);
    }

    /* Images */
    .bg1 { background-image: url('1.jpg'); }
    .bg2 { background-image: url('2.jpg'); }
    .bg3 { background-image: url('3.jpg'); }
    .bg4 { background-image: url('4.jpg'); }
    
    /* Video Background Container */
    .bg5 { background: #000; }
    .bg-video-wrap {
      position: absolute; inset: 0; width: 100%; height: 100%;
    }
    .bg-video-wrap video {
      width: 100%; height: 100%; object-fit: cover;
      opacity: 0.85; /* Thoda dim kiya hai taaki text clear dikhe */
      pointer-events: none;
    }

    .bg-overlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      background:
        linear-gradient(to bottom, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.75) 100%);
      pointer-events: none;
    }

    /* ── Particles ── */
    .particles {
      position: fixed;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 10px var(--gold), 0 0 20px var(--gold);
      animation: floatUp linear infinite;
    }

    @keyframes floatUp {
      0%   { transform: translateY(105vh) scale(0); opacity: 0; }
      20%  { opacity: 0.8; }
      80%  { opacity: 0.5; }
      100% { transform: translateY(-10vh) scale(2); opacity: 0; }
    }

    /* ── Sections & Typography ── */
    .sections-wrap {
      position: relative;
      z-index: 10;
    }

    .section {
      position: relative;
      min-height: 100vh;
      min-height: 100dvh;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 60px 40px;
    }

    .content {
      max-width: 900px;
      text-align: center;
      color: var(--white);
      opacity: 0;
      will-change: opacity;
    }

    .line-accent {
      display: block;
      width: 60px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin: 0 auto 35px;
      opacity: 0;
      transform: scaleX(0);
      transform-origin: center;
    }

    /* ── Lyric Text Reveal CSS ── */
    .dialogue {
      font-size: clamp(1.6rem, 4vw, 3.8rem);
      font-weight: 300;
      line-height: 1.5;
      letter-spacing: 0.5px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.25em;
    }

    .dialogue .word {
      opacity: 0;
      transform: translateY(40px) scale(0.9);
      filter: blur(15px);
      display: inline-block;
      color: transparent;
      -webkit-text-stroke: 1.5px rgba(255, 255, 255, 0.4);
      transition: all 0.4s ease;
    }

    .dialogue .word.filled {
      color: var(--white);
      -webkit-text-stroke: 0px;
      text-shadow: 0 0 20px var(--gold-light), 0 0 40px rgba(212,175,122,0.5);
    }

    .dialogue em {
      font-style: italic;
      color: var(--gold);
      -webkit-text-stroke: 0px;
      text-shadow: 0 0 30px rgba(212,175,122,0.8);
      position: relative;
      display: inline-block;
    }

    /* ── Final Section ── */
    .final-section {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 0;
      perspective: 1000px;
    }

    .name-wrap {
      position: relative;
      display: inline-block;
      transform-style: preserve-3d;
      will-change: transform;
    }

    .special-name {
      font-family: 'Cinzel', serif;
      font-size: clamp(3.5rem, 11vw, 9.5rem);
      font-weight: 700;
      letter-spacing: 8px;
      display: block;
      color: var(--white);
      text-shadow:
        0 0 30px rgba(212,175,122,0.6),
        0 0 80px rgba(212,175,122,0.3),
        0 0 140px rgba(212,175,122,0.2);
      transform: translateZ(50px);
    }

    .name-underline {
      display: block;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold), var(--white), var(--gold), transparent);
      margin-top: 8px;
      opacity: 0;
      transform: scaleX(0);
      transform: translateZ(20px);
    }

    .subtitle {
      font-size: clamp(0.85rem, 2vw, 1.1rem);
      letter-spacing: 5px;
      font-weight: 300;
      text-transform: uppercase;
      color: var(--gold-light);
      margin-top: 30px;
      opacity: 0;
      transform: translateY(20px) translateZ(30px);
      text-shadow: 0 0 20px rgba(212,175,122,0.5);
    }

    .heart {
      display: inline-block;
      color: #ff4d4d;
      text-shadow: 0 0 15px rgba(255,77,77,0.6);
      animation: heartBeat 1.2s ease infinite;
    }

    @keyframes heartBeat {
      0%,100% { transform: scale(1); }
      15%     { transform: scale(1.3); }
      30%     { transform: scale(1); }
      45%     { transform: scale(1.3); }
    }

    /* ── Progress Bar & Counters ── */
    .progress-bar {
      position: fixed;
      top: 0; left: 0;
      width: 0%;
      height: 3px;
      background: linear-gradient(90deg, var(--gold), #fff, var(--gold-light));
      z-index: 10000;
      box-shadow: 0 0 10px var(--gold);
      transition: width 0.1s linear;
    }

    .counter {
      position: fixed;
      bottom: 36px;
      right: 40px;
      font-size: 0.7rem;
      letter-spacing: 3px;
      color: rgba(255,255,255,0.4);
      z-index: 10000;
      font-family: 'Cinzel', serif;
    }

    /* ── Scroll Hint ── */
    .scroll-hint {
      position: fixed;
      bottom: 36px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10000;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      opacity: 0;
      transition: opacity 0.6s ease;
      pointer-events: none;
    }

    .scroll-hint.visible { opacity: 1; }
    .scroll-hint.hidden  { opacity: 0; }

    .scroll-hint span {
      font-size: 0.65rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.6);
      font-family: 'Poppins', sans-serif;
    }

    .scroll-arrow {
      width: 20px;
      height: 20px;
      border-right: 2px solid rgba(212,175,122,0.8);
      border-bottom: 2px solid rgba(212,175,122,0.8);
      transform: rotate(45deg);
      animation: arrowBounce 1.4s ease infinite;
    }

    @keyframes arrowBounce {
      0%, 100% { transform: rotate(45deg) translateY(0);   opacity: 0.4; }
      50%      { transform: rotate(45deg) translateY(5px); opacity: 1;   }
    }

    /* ── Mobile Optimizations ── */
    @media (max-width: 768px) {
      body { cursor: auto; }
      .cursor, .cursor-ring, .audio-toggle { display: none; }
      .start-btn { cursor: pointer; }
      .dialogue { gap: 0.2em; }
    }
  </style>
</head>
<body class="lock-scroll">

  <audio id="bgMusic" loop>
    <source src="magic.mp3" type="audio/mpeg">
  </audio>

  <div class="cursor" id="cursor"></div>
  <div class="cursor-ring" id="cursorRing"></div>

  <div class="audio-toggle" id="audioToggle">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="audioIcon">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
      <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
      <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
    </svg>
  </div>

  <div class="progress-bar" id="progressBar"></div>
  <div class="counter" id="counter">01 / 05</div>

  <div class="intro" id="intro">
    <span class="intro-label">A message for you</span>
    <button class="start-btn" id="startBtn">Ready, Marya? ✨</button>
  </div>

  <div class="scroll-hint" id="scrollHint">
    <span>scroll karo</span>
    <div class="scroll-arrow"></div>
  </div>

  <div class="bg-container" id="ripples">
    <div class="bg bg1 active"></div>
    <div class="bg bg2"></div>
    <div class="bg bg3"></div>
    <div class="bg bg4"></div>
    <!-- Replaced bg5 image with video -->
    <div class="bg bg5">
      <div class="bg-video-wrap">
        <video id="bgVideo5" autoplay loop muted playsinline>
          <source src="5.mp4" type="video/mp4">
        </video>
      </div>
    </div>
  </div>

  <div class="bg-overlay"></div>

  <div class="particles" id="particles"></div>

  <div class="sections-wrap">
    <section class="section" data-index="0">
      <div class="content">
        <span class="line-accent"></span>
        <div class="dialogue" data-text="Dosti se shuru hui thi yeh kahani..."></div>
      </div>
    </section>

    <section class="section" data-index="1">
      <div class="content">
        <span class="line-accent"></span>
        <div class="dialogue" data-text="Aur aaj yeh zindagi ka <em>sabse khoobsurat hissa</em> ban chuki hai."></div>
      </div>
    </section>

    <section class="section" data-index="2">
      <div class="content">
        <span class="line-accent"></span>
        <div class="dialogue" data-text="Chahe waqt acha ho ya bura tumhari awaaz hi <em>sab theek kar deti hai.</em>"></div>
      </div>
    </section>

    <section class="section" data-index="3">
      <div class="content">
        <span class="line-accent"></span>
        <div class="dialogue" data-text="Humari vibe alag hai tumhari jagah alag hai <em>koi replace nahi kar sakta.</em>"></div>
      </div>
    </section>

    <section class="section final-section" data-index="4">
      <div class="content final-content">
        <div class="name-wrap" id="nameWrap">
          <span class="special-name">Marya</span>
          <span class="name-underline"></span>
        </div>
        <div class="subtitle">
          Meri <span class="heart">❤</span> Bestie Darling
        </div>
      </div>
    </section>
  </div>

  <script>
    gsap.registerPlugin(ScrollTrigger);

    const isMobile = /Android|iPhone|iPad|iPod|Opera Mini|IEMobile|WPDesktop/i.test(navigator.userAgent) || window.innerWidth <= 768;

    /* ── Split Text for Lyric Reveal ── */
    document.querySelectorAll('.dialogue').forEach(el => {
      let html = el.getAttribute('data-text');
      el.innerHTML = html.split(' ').map(word => `<span class="word">${word}</span>`).join(' ');
    });

    const intro = document.getElementById('intro');
    const startBtn = document.getElementById('startBtn');
    const music = document.getElementById('bgMusic');
    const audioToggle = document.getElementById('audioToggle');
    const audioIcon = document.getElementById('audioIcon');
    const body = document.body;

    /* ── Custom Cursor ── */
    if (!isMobile) {
      const cursor = document.getElementById('cursor');
      const cursorRing = document.getElementById('cursorRing');
      
      document.addEventListener('mousemove', (e) => {
        cursor.style.left = e.clientX + 'px';
        cursor.style.top = e.clientY + 'px';
        cursorRing.style.left = e.clientX + 'px';
        cursorRing.style.top = e.clientY + 'px';
      });

      document.querySelectorAll('button, a, .audio-toggle').forEach(el => {
        el.addEventListener('mouseenter', () => {
          cursor.style.transform = 'translate(-50%,-50%) scale(2.5)';
          cursorRing.style.transform = 'translate(-50%,-50%) scale(0.5)';
        });
        el.addEventListener('mouseleave', () => {
          cursor.style.transform = 'translate(-50%,-50%) scale(1)';
          cursorRing.style.transform = 'translate(-50%,-50%) scale(1)';
        });
      });
    }

    /* ── Audio Controls ── */
    let isPlaying = false;
    
    function toggleAudio() {
      if(isPlaying) {
        music.pause();
        audioIcon.innerHTML = `<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line>`;
      } else {
        music.play();
        audioIcon.innerHTML = `<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>`;
      }
      isPlaying = !isPlaying;
    }

    audioToggle.addEventListener('click', toggleAudio);

    /* ── Start Sequence ── */
    startBtn.addEventListener('click', () => {
      music.volume = 0;
      music.play().then(() => { isPlaying = true; }).catch(() => {});

      // Trigger video play securely after user interaction for mobile policies
      const bgVid = document.getElementById('bgVideo5');
      if(bgVid) bgVid.play().catch(()=>{});

      let vol = 0;
      const fadeIn = setInterval(() => {
        vol = Math.min(vol + 0.03, 0.8);
        music.volume = vol;
        if (vol >= 0.8) clearInterval(fadeIn);
      }, 120);

      body.classList.remove('lock-scroll');

      gsap.to(intro, {
        opacity: 0, scale: 1.1, duration: 1.5, ease: 'power3.inOut',
        onComplete: () => {
          intro.style.display = 'none';
          document.getElementById('scrollHint').classList.add('visible');
          if(!isMobile) audioToggle.classList.add('visible');
        }
      });
    });

    /* ── Scroll Hint ── */
    window.addEventListener('scroll', () => {
      if (window.scrollY > 30) {
        document.getElementById('scrollHint').classList.remove('visible');
        document.getElementById('scrollHint').classList.add('hidden');
      }
    }, { passive: true, once: false });

    /* ── Enhanced Ripples ── */
    $(document).ready(function () {
      try {
        // Exclude video slide (.bg5) from ripples to avoid WebGL errors
        $('.bg:not(.bg5)').ripples({
          resolution: isMobile ? 256 : 512,
          dropRadius: 20,
          perturbance: 0.03,
        });

        const dropRipple = (e) => {
          const activeBg = $('.bg.active:not(.bg5)');
          if(activeBg.length) {
            activeBg.ripples('drop', e.clientX || e.touches[0].clientX, e.clientY || e.touches[0].clientY, 20, 0.03);
          }
        };

        document.addEventListener('mousemove', dropRipple);
        document.addEventListener('touchmove', dropRipple, { passive: true });
      } catch(e) { console.log('WebGL ripples not supported'); }
    });

    /* ── Sparkling Particles ── */
    const particlesContainer = document.getElementById('particles');
    for (let i = 0; i < 60; i++) {
      const p = document.createElement('div');
      p.classList.add('particle');
      const size = Math.random() * 3 + 1;
      p.style.cssText = `
        left: ${Math.random() * 100}vw;
        width: ${size}px; height: ${size}px;
        animation-duration: ${10 + Math.random() * 15}s;
        animation-delay: ${Math.random() * 10}s;
      `;
      particlesContainer.appendChild(p);
    }

    /* ── Scroll Progress ── */
    window.addEventListener('scroll', () => {
      const pct = (window.scrollY / (document.body.scrollHeight - window.innerHeight)) * 100;
      document.getElementById('progressBar').style.width = pct + '%';
    }, { passive: true });

    /* ── Background & Counter Sync ── */
    const backgrounds = document.querySelectorAll('.bg');
    const sections = document.querySelectorAll('.section');

    function setBackground(index) {
      backgrounds.forEach((bg, i) => {
        if (i === index) {
          bg.classList.add('active');
          bg.style.opacity = '1';
        } else {
          bg.classList.remove('active');
          bg.style.opacity = '0';
        }
      });
      document.getElementById('counter').textContent = String(index + 1).padStart(2, '0') + ' / 05';
    }

    const bgObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          setBackground(parseInt(entry.target.dataset.index));
        }
      });
    }, { threshold: 0.6 });

    sections.forEach(section => bgObserver.observe(section));

    /* ── Cinematic Content & Word Reveal ── */
    const contentObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        const content = entry.target;
        const lineAccent = content.querySelector('.line-accent');
        const words = content.querySelectorAll('.word');
        
        if (entry.isIntersecting) {
          const tl = gsap.timeline();
          if (lineAccent) {
            tl.to(lineAccent, { scaleX: 1, opacity: 0.8, duration: 1, ease: 'power3.out' });
          }
          
          gsap.to(content, { opacity: 1, duration: 0.1 });
          
          if(words.length) {
            gsap.to(words, {
              opacity: 1, y: 0, scale: 1, filter: 'blur(0px)',
              duration: 0.8, stagger: 0.1, ease: 'back.out(1.5)',
              delay: lineAccent ? 0.3 : 0,
              onComplete: function() {
                this.targets().forEach(el => el.classList.add('filled'));
              }
            });
          }
        } else {
          gsap.to(content, { opacity: 0, duration: 0.8 });
          if (lineAccent) gsap.to(lineAccent, { scaleX: 0, opacity: 0, duration: 0.5 });
          if (words.length) {
            words.forEach(el => el.classList.remove('filled'));
            gsap.to(words, { opacity: 0, y: 40, scale: 0.9, filter: 'blur(15px)', duration: 0.4 });
          }
        }
      });
    }, { threshold: 0.3 });

    document.querySelectorAll('.content').forEach(c => contentObserver.observe(c));

    /* ── Final Section 3D Tilt & Reveal ── */
    const finalObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          gsap.to('.name-underline', { scaleX: 1, opacity: 1, duration: 1.5, ease: 'power3.out', delay: 0.5 });
          gsap.to('.subtitle', { opacity: 1, y: 0, duration: 1.5, ease: 'power3.out', delay: 0.8 });
        } else {
          gsap.to('.name-underline', { scaleX: 0, opacity: 0, duration: 0.5 });
          gsap.to('.subtitle', { opacity: 0, y: 20, duration: 0.5 });
        }
      });
    }, { threshold: 0.4 });

    const finalContent = document.querySelector('.final-content');
    if (finalContent) finalObserver.observe(finalContent);

    /* ── 3D Hover Tilt Effect on Name ── */
    if (!isMobile) {
      const nameWrap = document.getElementById('nameWrap');
      document.querySelector('.final-section').addEventListener('mousemove', (e) => {
        const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
        const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
        gsap.to(nameWrap, { rotationY: -xAxis, rotationX: yAxis, ease: 'power1.out', duration: 0.5 });
      });
      document.querySelector('.final-section').addEventListener('mouseleave', () => {
        gsap.to(nameWrap, { rotationY: 0, rotationX: 0, ease: 'power3.out', duration: 1 });
      });
    }

  </script>
</body>
</html>
